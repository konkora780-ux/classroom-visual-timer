<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff4e6"><title>わくわくタイマー</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;background:linear-gradient(145deg,#fff3c9,#ffe4ed 55%,#dceeff);color:#263354;display:grid;place-items:center;padding:22px}.app{width:min(100%,530px);text-align:center}.badge{display:inline-block;background:#fff;border-radius:40px;padding:8px 18px;color:#ee5b83;font-weight:800;box-shadow:0 4px 0 #f4c9d3}h1{font-size:clamp(29px,8vw,42px);margin:18px 0 6px;letter-spacing:.06em}.sub{margin:0 0 20px;color:#65728d;font-weight:600}.card{background:#ffffffeb;border:4px solid white;border-radius:32px;padding:22px 16px 25px;box-shadow:0 14px 0 #d6d5ed,0 22px 40px #7e88b12e}.ring{width:min(72vw,300px);height:min(72vw,300px);margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ff8b42 0deg,#ff8b42 360deg,#e9ecf6 360deg);box-shadow:0 9px 24px #ffab783d}.inner{width:82%;height:82%;background:white;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}.label{font-size:14px;font-weight:800;color:#8b91a5}.clock{font-size:clamp(48px,12vw,66px);font-weight:900;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.status{font-weight:900;color:#ee678a;min-height:26px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:17px 0}.controls label{font-size:14px;font-weight:800;display:flex;align-items:center;gap:5px}input{width:67px;border:2px solid #d8def0;border-radius:12px;padding:9px 4px;text-align:center;font:800 20px system-ui;color:#263354;background:#f8faff}button{border:0;border-radius:17px;padding:15px 18px;font-size:17px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 5px 0 #0002}button:disabled{opacity:.45;cursor:default}#start{background:#23b88e}#pause{background:#6489ed}#reset{background:#fa7592}.buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.hint{font-size:13px;color:#79849d;margin-top:21px}@media(max-width:350px){button{padding:12px;font-size:15px}}
 .extras{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.extras button{font-size:13px;padding:10px 12px;background:#8a70d8}.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.presets button{background:#f4a93b;padding:9px 15px;font-size:14px}.voiceopt{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;font-size:14px;font-weight:700;color:#596780}.voiceopt input{width:18px;height:18px} :fullscreen body{min-height:100vh} .app:fullscreen{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(145deg,#fff3c9,#ffe4ed 55%,#dceeff);overflow:auto;padding:16px}.app:fullscreen .card{width:min(90vw,700px)} .app:fullscreen .ring{width:min(55vh,60vw,430px);height:min(55vh,60vw,430px)} .app:fullscreen .clock{font-size:clamp(65px,11vw,110px)}  .sequence{margin-top:20px;padding:14px;background:#f3f6ff;border-radius:20px}.sequence h2{font-size:17px;margin:0 0 9px}.steps{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.steps input{width:100px;font-size:14px}.steps input[type=number]{width:64px}.sequence button,.extend button{font-size:13px;padding:10px 12px;background:#8a70d8}.extend{display:flex;gap:8px;justify-content:center;margin:13px 0}.extend button{background:#18a9c4}.stepinfo{font-weight:800;color:#5866a1;margin:8px}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.confetti span{position:absolute;top:-10vh;font-size:27px;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(800deg);opacity:0}}@media(prefers-reduced-motion:reduce){.confetti span{animation:none;display:none}} .modebar,.multi{margin-top:16px;padding:13px;border-radius:18px;background:#f2f6ff}.modebar select{font-size:16px;padding:8px;border-radius:10px;border:2px solid #cbd6ee}.barview{display:none;height:32px;background:#e9ecf6;border-radius:18px;overflow:hidden;margin:18px 0}.barfill{height:100%;width:100%;background:#20b8ad;transition:width .2s}.sandview{display:none;font-size:90px;line-height:1.3}.app[data-view=bar] .ring,.app[data-view=sand] .ring{display:none}.app[data-view=bar] .barview,.app[data-view=sand] .sandview{display:block}.multi button{font-size:13px;padding:9px 12px;background:#6489ed}.multirow{display:flex;justify-content:space-between;align-items:center;gap:7px;background:white;border-radius:12px;margin:8px 0;padding:8px;font-weight:800}.multirow input{width:75px;font-size:15px}.multirow button{white-space:nowrap}.multirow .mini-time{font-variant-numeric:tabular-nums}.multi summary{font-size:17px;font-weight:800;cursor:pointer;padding:8px;border-radius:10px}.multi summary:focus-visible{outline:3px solid #6489ed;outline-offset:3px}.multi[open] summary{margin-bottom:8px} .layoutpick{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:12px auto;padding:12px;background:#ffffffd9;border-radius:18px;font-weight:800}.layoutpick label{display:flex;align-items:center;gap:5px;cursor:pointer}.layoutpick input{width:20px;height:20px;accent-color:#6489ed}.timer-display{min-width:0;display:flex;flex-direction:column;justify-content:center}.timer-actions{min-width:0}.app[data-layout=landscape]{width:min(96vw,1100px)}.app[data-layout=landscape] .card{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}.app[data-layout=landscape] .timer-display{grid-column:1;grid-row:1}.app[data-layout=landscape] .timer-actions{grid-column:2;grid-row:1}.app[data-layout=landscape] .sequence,.app[data-layout=landscape] .multi{grid-column:1/-1;margin-top:8px}.app[data-layout=landscape] .ring{width:min(40vw,390px);height:min(40vw,390px)}.app[data-layout=landscape] .clock{font-size:clamp(44px,6vw,86px)}@media(max-width:650px){.app[data-layout=landscape] .card{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:12px 8px}.app[data-layout=landscape] .ring{width:min(43vw,220px);height:min(43vw,220px)}.app[data-layout=landscape] .clock{font-size:clamp(26px,6vw,48px)}.app[data-layout=landscape] button{padding:9px;font-size:12px}.app[data-layout=landscape] .controls{margin:8px 0}.app[data-layout=landscape] .controls input{width:52px;font-size:15px}.app[data-layout=landscape] .presets button{padding:7px}.app[data-layout=landscape] .label{font-size:11px}}@media(min-width:700px){.app[data-layout=portrait]{width:min(90vw,680px)}.app[data-layout=portrait] .ring{width:min(48vw,360px);height:min(48vw,360px)}} /* Keep the timer and its controls together within a landscape viewport. */
@media (orientation:landscape){
 body{padding:10px 16px}
 .app[data-layout=landscape] .badge{font-size:11px;padding:4px 12px}
 .app[data-layout=landscape] h1{font-size:28px;margin:6px 0}
 .app[data-layout=landscape] .sub{display:none}
 .app[data-layout=landscape] .layoutpick{margin:6px auto;padding:6px;font-size:13px}
 .app[data-layout=landscape] .card{padding:12px;gap:10px 16px}
 .app[data-layout=landscape] .timer-display{grid-row:1/3;align-self:center}
 .app[data-layout=landscape] .sequence{grid-column:2;grid-row:2;margin:0;padding:10px}
 .app[data-layout=landscape] .multi{margin:0;padding:5px 10px}
 .app[data-layout=landscape] .ring{width:min(36vw,calc(100svh - 240px),350px);height:min(36vw,calc(100svh - 240px),350px);margin-bottom:8px}
 .app[data-layout=landscape] .modebar{margin-top:4px;padding:6px}
 .app[data-layout=landscape] .presets{margin:0 0 8px}
 .app[data-layout=landscape] .controls,.app[data-layout=landscape] .extend{margin:8px 0}
 .app[data-layout=landscape] .voiceopt,.app[data-layout=landscape] .extras{margin-top:10px}
 .app[data-layout=landscape] .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr) 48px);gap:4px}
 .app[data-layout=landscape] .steps input{width:100%;min-width:0;padding:6px 2px;font-size:13px}
 .app[data-layout=landscape] .sequence h2{font-size:15px;margin-bottom:6px}
 .app[data-layout=landscape] .stepinfo{font-size:13px;margin:4px;overflow-wrap:anywhere}
 .app[data-layout=landscape] .hint{font-size:11px;margin:8px 0 0}
 .app[data-layout=landscape]:fullscreen{display:block;padding:10px 16px}
 .app[data-layout=landscape]:fullscreen .card{width:100%}
 .app[data-layout=landscape]:fullscreen .clock{font-size:clamp(36px,6vw,76px)}
}
@media (orientation:landscape) and (max-height:750px){
 body{padding:5px 10px}
 .app[data-layout=landscape],.app[data-layout=landscape]:fullscreen{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
 .app[data-layout=landscape] .card{grid-column:1/-1}
 .app[data-layout=landscape] .badge,.app[data-layout=landscape] .hint{display:none}
 .app[data-layout=landscape] h1{font-size:22px;margin:0}
 .app[data-layout=landscape] .layoutpick{padding:3px;margin:3px auto}
 .app[data-layout=landscape] .card{padding:8px;gap:6px 12px;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
 .app[data-layout=landscape] .timer-actions{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-items:center}
 .app[data-layout=landscape] .presets,.app[data-layout=landscape] .buttons{grid-column:1/-1}
 .app[data-layout=landscape] .presets,.app[data-layout=landscape] .controls,.app[data-layout=landscape] .extend,.app[data-layout=landscape] .voiceopt,.app[data-layout=landscape] .extras{margin:0;gap:5px}
 .app[data-layout=landscape] button{font-size:12px;padding:6px 8px}
 .app[data-layout=landscape] .controls input{width:48px;font-size:15px;padding:5px 2px}
 .app[data-layout=landscape] .voiceopt{font-size:12px}
 .app[data-layout=landscape] .sequence{padding:4px}
 .app[data-layout=landscape] .sequence h2{font-size:14px;margin-bottom:3px}
 .app[data-layout=landscape] .steps input{padding:4px 2px}
 .app[data-layout=landscape] .stepinfo{margin:2px;font-size:12px}
 .app[data-layout=landscape] .ring{width:min(30vw,calc(100svh - 220px));height:min(30vw,calc(100svh - 220px))}
 .app[data-layout=landscape] .clock{font-size:clamp(32px,6vw,64px)}
 .app[data-layout=landscape] .modebar,.app[data-layout=landscape] .modebar select{font-size:12px;padding:4px}
 .app[data-layout=landscape] .multi summary{font-size:14px;padding:4px}
}
</style></head><body><main class="app"><div class="badge">★ CLASSROOM TIMER ★</div><h1>わくわくタイマー</h1><p class="sub">のこり時間がひと目でわかる！</p><div class="layoutpick" role="group" aria-label="画面の配置"><label><input type="radio" name="layout" value="auto">自動切り替え</label><label><input type="radio" name="layout" value="landscape">横向き固定</label><label><input type="radio" name="layout" value="portrait">縦向き固定</label></div><section class="card"><div class="timer-display"><div class="ring" id="ring"><div class="inner"><span class="label">のこり時間</span><div id="clock" class="clock" role="timer">05:00</div><div id="status" class="status" aria-live="polite">じゅんびOK！</div></div></div><div class="barview"><div class="barfill" id="barfill"></div></div><div class="sandview" id="sandview" aria-hidden="true">⌛</div><div class="modebar"><label>表示デザイン <select id="viewmode"><option value="circle">円形</option><option value="bar">横棒</option><option value="sand">砂時計</option></select></label></div></div><div class="timer-actions"><div class="presets"><button data-time="60">1分</button><button data-time="180">3分</button><button data-time="300">5分</button><button data-time="600">10分</button></div><div class="controls"><label>分 <input id="minutes" type="number" min="0" max="999" value="5"></label><label>秒 <input id="seconds" type="number" min="0" max="59" value="0"></label></div><div class="extend"><button id="plus1">＋1分</button><button id="plus5">＋5分</button></div><div class="buttons"><button id="start">▶ スタート</button><button id="pause" disabled>Ⅱ とめる</button><button id="reset">↺ リセット</button></div><label class="voiceopt"><input id="voice" type="checkbox" checked> 音声でお知らせ</label><div class="extras"><button id="fullscreen">⛶ 全画面</button><button id="soundtest">♪ 音を確認</button></div></div><div class="sequence"><h2>連続タイマー</h2><div class="steps"><input id="step1" value="準備" aria-label="1番目の活動名"><input id="step1min" type="number" min="1" max="999" value="3" aria-label="1番目の分数"><input id="step2" value="活動" aria-label="2番目の活動名"><input id="step2min" type="number" min="1" max="999" value="15" aria-label="2番目の分数"><input id="step3" value="片付け" aria-label="3番目の活動名"><input id="step3min" type="number" min="1" max="999" value="5" aria-label="3番目の分数"></div><div id="stepinfo" class="stepinfo"></div><button id="sequenceStart">▶ 連続タイマー開始</button><button id="sequenceCancel">連続を解除</button></div><details class="multi"><summary>同時タイマー（3つ）</summary><div id="multirows"></div></details></section><div id="confetti" class="confetti" aria-hidden="true"></div><p class="hint">残り半分までは青緑、半分から黄色、残り4分の1で赤になるよ</p></main><script>
const $=id=>document.getElementById(id);let remaining=300,total=300,deadline=0,interval=null,running=false,announced=new Set(),audioCtx=null,sequence=[],stepIndex=0;
function saveSettings(){try{localStorage.setItem('wakuwaku-settings-v1',JSON.stringify({minutes:$('minutes').value,seconds:$('seconds').value,voice:$('voice').checked,view:$('viewmode').value,layout:document.querySelector('input[name=layout]:checked')?.value||'auto',steps:[1,2,3].map(i=>[$('step'+i).value,$('step'+i+'min').value])}))}catch(e){}}
function loadSettings(){try{const s=JSON.parse(localStorage.getItem('wakuwaku-settings-v1')||'null');if(!s)return;$('minutes').value=s.minutes??5;$('seconds').value=s.seconds??0;$('voice').checked=s.voice!==false;$('viewmode').value=s.view||'circle';(s.steps||[]).forEach((step,i)=>{if(i<3){$('step'+(i+1)).value=step[0];$('step'+(i+1)+'min').value=step[1]}});total=remaining=duration();const chosen=document.querySelector('input[name=layout][value="'+(s.layout||'auto')+'"]');if(chosen)chosen.checked=true;applyLayout();$('viewmode').dispatchEvent(new Event('change'))}catch(e){}}
function applyLayout(){const mode=document.querySelector('input[name=layout]:checked')?.value||'auto';const portrait=window.matchMedia('(orientation: portrait)').matches;$('viewmode').closest('.app').dataset.layout=mode==='auto'?(portrait?'portrait':'landscape'):mode}
function duration(){const m=Math.max(0,Math.min(999,Math.floor(Number($('minutes').value)||0)));const s=Math.max(0,Math.min(59,Math.floor(Number($('seconds').value)||0)));return m*60+s}
function draw(){const m=Math.floor(remaining/60),s=remaining%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');const deg=total?360*remaining/total:0;const ratio=total?remaining/total:0;const color=ratio<=0.25?'#f25267':ratio<=0.5?'#ffcf35':'#20b8ad';$('ring').style.background='conic-gradient('+color+' '+deg+'deg,#e9ecf6 '+deg+'deg)';$('barfill').style.width=(ratio*100)+'%';$('barfill').style.background=color;$('sandview').textContent=ratio>0.5?'⌛':ratio>0?'⏳':'⌛'}
function stop(){clearInterval(interval);interval=null;running=false;$('start').disabled=false;$('pause').disabled=true}
function speak(t){if(!$('voice').checked||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function chime(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();[0,.2,.4].forEach((delay,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type='sine';o.frequency.value=[660,880,1046][i];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.17,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.2)})}catch(e){}}
function celebrate(){const box=$('confetti');box.replaceChildren();if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<35;i++){const el=document.createElement('span');el.textContent=['🎉','⭐','✨','🎊'][i%4];el.style.left=Math.random()*100+'%';el.style.animationDelay=Math.random()*.7+'s';box.append(el)}setTimeout(()=>box.replaceChildren(),3800)}
function setStep(i){stepIndex=i;total=remaining=sequence[i].seconds;announced.clear();$('minutes').value=Math.floor(total/60);$('seconds').value=total%60;$('stepinfo').textContent=(i+1)+' / '+sequence.length+'：'+sequence[i].name;draw()}
function tick(){const before=remaining;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));draw();for(const [mark,message] of [[60,'残り1分です'],[10,'残り10秒です']]){if(total>mark&&before>mark&&remaining<=mark&&!announced.has(mark)){announced.add(mark);speak(message)}}if(!remaining){stop();chime();if(sequence.length&&stepIndex<sequence.length-1){setStep(stepIndex+1);$('status').textContent='次は '+sequence[stepIndex].name;speak('次は'+sequence[stepIndex].name+'です');startTimer()}else{sequence=[];$('stepinfo').textContent='';$('status').textContent='🎉 おしまい！';celebrate();speak('時間になりました')}}}
function startTimer(){if(running)return;clearInterval(interval);interval=null;if(!remaining){total=duration();remaining=total}if(!remaining){$('status').textContent='時間を入れてね';return}if(remaining===total)announced.clear();try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}deadline=Date.now()+remaining*1000;running=true;$('start').disabled=true;$('pause').disabled=false;$('status').textContent='けいそく中！';tick();interval=setInterval(tick,200)}
$('start').onclick=()=>startTimer();
$('pause').onclick=()=>{if(!running)return;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));stop();draw();$('status').textContent=remaining?'いったんストップ':'時間になりました'};
$('reset').onclick=()=>{stop();sequence=[];$('stepinfo').textContent='';total=duration();remaining=total;announced.clear();draw();$('status').textContent='じゅんびOK！'};
$('plus1').onclick=()=>extend(60);$('plus5').onclick=()=>extend(300);function extend(seconds){if(!remaining&&!running)return;remaining+=seconds;total+=seconds;if(running)deadline+=seconds*1000;draw();$('status').textContent='時間を延長しました'}
$('sequenceStart').onclick=()=>{const steps=[1,2,3].map(i=>({name:$('step'+i).value.trim()||'活動'+i,seconds:Math.floor(Number($('step'+i+'min').value))*60}));if(steps.some(x=>!Number.isFinite(x.seconds)||x.seconds<60||x.seconds>59940)){$('status').textContent='各活動を1〜999分にしてね';return}stop();sequence=steps;setStep(0);startTimer()};$('sequenceCancel').onclick=()=>{sequence=[];$('stepinfo').textContent='';$('status').textContent=running?'単独タイマーとして計測中':'連続タイマーを解除しました'};
$('minutes').onchange=$('seconds').onchange=()=>{if(!running){sequence=[];$('stepinfo').textContent='';total=duration();remaining=total;announced.clear();draw()}saveSettings()};document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{stop();sequence=[];$('stepinfo').textContent='';total=remaining=Number(b.dataset.time);$('minutes').value=Math.floor(total/60);$('seconds').value=total%60;announced.clear();draw();saveSettings();$('status').textContent='じゅんびOK！'});$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if($('fullscreen').closest('.app').requestFullscreen){await $('fullscreen').closest('.app').requestFullscreen()}else{$('status').textContent='このブラウザは全画面表示に対応していません'}}catch(e){$('status').textContent='全画面にできませんでした'}};$('soundtest').onclick=()=>{chime();speak('音声テストです')};$('viewmode').onchange=()=>{$('viewmode').closest('.app').dataset.view=$('viewmode').value;saveSettings()};$('voice').onchange=saveSettings;[1,2,3].forEach(i=>{for(const suffix of ['', 'min'])$('step'+i+suffix).addEventListener('change',saveSettings)});
const minis=[1,2,3].map(i=>({remaining:60*i,deadline:0,running:false,done:false}));const rows=$('multirows');minis.forEach((t,i)=>{const row=document.createElement('div');row.className='multirow';row.innerHTML='<span>タイマー'+(i+1)+'</span><input type="number" min="1" max="999" value="'+(i+1)+'" aria-label="タイマー'+(i+1)+'の分数"><span class="mini-time">0'+(i+1)+':00</span><button>開始</button>';rows.append(row);const input=row.querySelector('input'),label=row.querySelector('.mini-time'),button=row.querySelector('button');t.input=input;t.label=label;t.button=button;button.onclick=()=>{if(t.running){t.remaining=Math.max(0,Math.ceil((t.deadline-Date.now())/1000));t.running=false;button.textContent='再開'}else{if(t.remaining<=0||t.done){const n=Number(input.value);if(!Number.isInteger(n)||n<1||n>999)return;t.remaining=n*60;t.done=false}t.deadline=Date.now()+t.remaining*1000;t.running=true;button.textContent='停止'} };input.onchange=()=>{if(!t.running){t.remaining=Math.max(1,Math.min(999,Number(input.value)||1))*60;t.done=false;label.textContent=fmt(t.remaining);button.textContent='開始'}}});function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}setInterval(()=>{for(const t of minis){if(!t.running)continue;t.remaining=Math.max(0,Math.ceil((t.deadline-Date.now())/1000));t.label.textContent=fmt(t.remaining);if(t.remaining===0){t.running=false;t.done=true;t.button.textContent='もう一度';chime();celebrate()}}},200);document.querySelectorAll('input[name=layout]').forEach(r=>r.addEventListener('change',()=>{applyLayout();saveSettings()}));document.querySelector('input[name=layout][value=auto]').checked=true;window.addEventListener('resize',applyLayout);screen.orientation?.addEventListener?.('change',applyLayout);applyLayout();loadSettings();draw();
</script></body></html>
