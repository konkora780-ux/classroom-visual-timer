<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シンプルタイマー</title>
<style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#202b3a;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;padding:2rem;border-radius:20px;box-shadow:0 10px 30px #0001;text-align:center;width:min(90vw,400px)}#clock{font-size:clamp(3rem,14vw,5rem);font-variant-numeric:tabular-nums;margin:1rem 0}input{font-size:1.1rem;width:5rem;padding:.4rem}button{font-size:1rem;padding:.7rem 1rem;margin:.4rem;border:0;border-radius:10px;background:#2459b8;color:white;cursor:pointer}button:disabled{opacity:.45}</style></head>
<body><main class="card"><h1>シンプルタイマー</h1><label>分 <input id="minutes" type="number" min="0" max="999" value="5"></label><label>秒 <input id="seconds" type="number" min="0" max="59" value="0"></label><div id="clock" role="timer" aria-live="off">05:00</div><button id="start">開始</button><button id="pause" disabled>一時停止</button><button id="reset">リセット</button><p id="status" aria-live="polite">準備完了</p></main>
<script>
const $=id=>document.getElementById(id);let remaining=300,deadline=null,interval=null,running=false;
function duration(){return Math.max(0,Math.floor(Number($('minutes').value)||0)*60+Math.floor(Number($('seconds').value)||0))}
function draw(){const m=Math.floor(remaining/60),s=remaining%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function stop(){clearInterval(interval);interval=null;running=false;$('start').disabled=false;$('pause').disabled=true}
function tick(){remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));draw();if(remaining===0){stop();$('status').textContent='時間になりました！'}}
$('start').onclick=()=>{if(running)return;if(remaining===0)remaining=duration();if(remaining===0){$('status').textContent='時間を設定してください';return}deadline=Date.now()+remaining*1000;running=true;$('start').disabled=true;$('pause').disabled=false;$('status').textContent='計測中';tick();interval=setInterval(tick,200)};
$('pause').onclick=()=>{tick();stop();$('status').textContent='一時停止中'};
$('reset').onclick=()=>{stop();remaining=duration();draw();$('status').textContent='準備完了'};
$('minutes').onchange=$('seconds').onchange=()=>{if(!running){remaining=duration();draw()}};draw();
</script></body></html>
